.lcard{display:grid;grid-template-columns:1fr 1.05fr;width:100%;max-width:820px;border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.lp{background:linear-gradient(160deg,#0f4a2c,var(--bk) 75%);color:#f2f5f3;padding:36px;display:flex;flex-direction:column;gap:18px;justify-content:space-between}
.lg{font:700 26px 'Fraunces',serif;display:flex;align-items:center;gap:10px}
.lg i{width:12px;height:12px;border-radius:50%;background:var(--red)}
.lp h1{font-size:clamp(28px,3.4vw,40px)}
.lp p{color:#b9c4be;margin:0}
.ls{display:flex;gap:22px}.ls b{display:block;font:700 26px 'Fraunces',serif}.ls div{font-size:13px;color:#b9c4be}
.rp{background:var(--gy);padding:28px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--g4);padding:5px;border-radius:12px;margin-bottom:20px}
.tabs button{border:0;background:none;border-radius:8px;padding:8px 2px;font-size:13px;font-weight:500}
.tabs button.on{background:var(--gc);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.rp h2{font-size:28px;margin-bottom:4px}.rp>p{color:var(--mut);margin:0 0 14px}
label{font-size:14px;font-weight:700;display:block;margin-top:10px}
input,select{width:100%;background:var(--gc);border:1px solid var(--g4);border-radius:10px;padding:11px 12px;margin-top:5px}
.pw{position:relative}.pw button{position:absolute;right:6px;top:10px;background:none;border:0;padding:6px}
.err{color:var(--red);font-size:14px;min-height:22px;margin-top:6px}
.main{width:100%;border:0;border-radius:10px;padding:13px;background:var(--dg);color:#fff;font-weight:700;margin-top:4px;transition:background .2s}
.main:hover{background:var(--bk)}
.demo{margin-top:14px;border:1.5px dashed var(--grn);border-radius:10px;padding:12px;font-size:14px;background:rgba(31,167,90,.1)}
.demo button{margin-top:8px;border:1px solid var(--g4);background:var(--gc);border-radius:8px;padding:7px 12px;font-weight:700}
.demo button:hover{border-color:var(--red)}
#app{display:none;min-height:100vh;background:var(--gy)}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--bk);color:#e5ebe7;padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside .lg{padding:0 10px;font-size:22px}
aside small{display:block;padding:4px 10px 14px;color:#7f8c86;border-bottom:1px solid #222a26;margin-bottom:10px;font-size:12px}
.nv{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:10px 12px;color:#c6d0ca;border-radius:0 10px 10px 0;font-size:15px}
.nv:hover{background:#151b18}
.nv.on{background:var(--dg);border-left-color:var(--lg);color:#fff;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 28px;background:var(--gc);border-bottom:1px solid var(--g4)}
.pill{background:var(--dg);color:#fff;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700;margin-left:8px}
.lo{background:var(--bk);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700}
.lo:hover{background:var(--red)}
main{padding:24px 28px;min-width:0}
.hero{background:linear-gradient(120deg,var(--dg),var(--bk));color:#fff;border-radius:18px;padding:28px;margin-bottom:16px}
.hero h1{font-size:clamp(26px,4vw,42px);max-width:20ch}.hero p{color:#b9c4be;margin:10px 0 0;max-width:56ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.st{background:var(--gc);border-radius:14px;padding:14px 16px;border-left:4px solid var(--g4)}
.st:nth-child(1){border-color:var(--grn)}.st:nth-child(2){border-color:var(--red)}
.st small{color:var(--mut)}.st b{display:block;font:700 26px 'Fraunces',serif}
.row{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.box{background:var(--gc);border-radius:14px;padding:18px;min-width:0}
.box h3{font-size:20px;margin-bottom:10px}.box>p{max-width:64ch}
.dk{background:var(--bk);color:#e5ebe7}.dk p{color:#b9c4be}
svg{width:100%;height:auto;display:block}
.key{font-size:13px;color:var(--mut)}.key b{color:var(--grn)}.key u{color:var(--red);text-decoration:none}
.btn{background:var(--gy);border:1px solid var(--g4);border-radius:9px;padding:9px 15px;text-decoration:none;color:var(--tx);display:inline-block;font-weight:500}
.btn:hover{border-color:var(--grn)}.btn.g{background:var(--dg);color:#fff;border-color:var(--dg)}.btn.g:hover{background:var(--bk)}
.btn.r{color:var(--red);border-color:var(--red);background:none}.btn.r:hover{background:var(--red);color:#fff}
.sm{padding:3px 10px;font-size:13px;margin-left:4px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}

['Savings goals','Set a target and track what you saved.',...U('goals',{e:1,sm:r=>'Saved so far: <b>₹'+r.reduce((a,x)=>a+x.saved,0)+'</b>'})],
['Spend wisely quiz','Short quiz on smart choices.','quiz'],
['Discipline score','See how steady your habits are.','score'],

stu:{tab:'🎓 Student',n:'Students',age:'18–24',t:'Track fees, spending and savings in one place.',f:[

['Link bank accounts','Link college and personal accounts.',...U('links',{})],
['Transactions','Everything you spent and earned.',...U('tx',{e:1,rc:1})],

['Monthly analysis','Income, expenses, savings and spending patterns.','chart'],
['AI receipts','A receipt is generated for each payment.',...U('tx',{rc:1,nd:1})],
['Business laws','Company law basics.',...U('lawC',R)],
['Entrepreneurship','Plan start-up ideas.',...U('ideas',{e:1})],
['Banking HUB','Compare banks and services.','bank'],
['Virtual Trading','Learn, then practice with no real money.','trade'],
['FinSmart Card','Apply and earn rewards.','card']]},
adu:{tab:'💼 Adult',n:'Adults',age:'21+',t:'Run your money and your business with clarity.',f:[

['Accounts and cards','Credit and debit cards.',...U('cards',{e:1})],
['Balance and transactions','All account activity.',...U('tx',{e:1,rc:1,sm:r=>'Net balance: <b>₹'+(sum('income')-sum('expense'))+'</b>'})],
['Register business','Add business details and webpage link.',...U('biz',{e:1})],

['Tax-saving options','Legal ways to reduce tax.','tax','legal tax saving options india 80C'],
['Receipts','Auto-generated and searchable.',...U('tx',{rc:1,nd:1})],
['Business laws','Regulations that apply to you.',...U('lawC',R)],
['Banking HUB','Banks, rules and regulations.','bank'],
['Virtual Trading','Learn, then practice with no real money.','trade']]},

['Users','View, add, update and remove users.',...U('users',{e:1})],

let cur,fi=-1,card='none',bonus=0,EI={},OFF={},QZ={i:0,s:0},CC,AI=[['b','Hi! Ask me about saving, spending, tax, investing, banks or business.']];
const sum=t=>D.tx.r.filter(r=>r.type==t).reduce((a,r)=>a+r.amt,0),rate=()=>{const i=sum('income');return i?(i-sum('expense'))/i:0},score=()=>Math.max(0,Math.min(100,Math.round(40+rate()*200))),pts=()=>Math.floor(sum('expense')/100)*0+bonus;
function tabs(k){cur=k;$('tabs').innerHTML=Object.keys(P).map(x=>`<button class="${x==k?'on':''}" onclick="tabs('${x}')">${P[x].tab}</button>`).join('');$('lt').textContent=P[k].n+' login';$('lsub').textContent='Ages '+P[k].age+'. '+P[k].t;$('lb').textContent='Login to '+P[k].n+' Portal'}
tabs('teen');
function login(){const e=$('em').value.trim();if(!/\S+@\S+/.test(e)){$('er').textContent='Enter any email id, like you@mail.com.';return}if($('pw').value!=='1234'){$('er').textContent='Wrong password. The demo password is 1234.';return}
 $('er').textContent='';$('login').style.display='none';$('app').style.display='block';$('un').textContent=e.split('@')[0];$('ur').textContent=P[cur].n;$('pn').textContent=P[cur].n+' portal · ages '+P[cur].age;
 $('nav').innerHTML=['Home',...P[cur].f.map(f=>f[0])].map((n,i)=>`<button class="nv" onclick="show(${i-1})">${n}</button>`).join('');show(-1);scrollTo(0,0)}

function logout(){$('app').style.display='none';$('login').style.display='flex';$('pw').value=''}

const rr=()=>show(fi);
function chart(){const m=MON.map(x=>['income','expense'].map(t=>D.tx.r.filter(r=>r.mon==x&&r.type==t).reduce((a,r)=>a+r.amt,0))),mx=Math.max(...m.flat(),1);return `<svg viewBox="0 0 400 190">${m.map((v,i)=>`<rect x="${30+i*90}" y="${160-v[0]/mx*140}" width="30" height="${v[0]/mx*140}" fill="#1fa75a"/><rect x="${62+i*90}" y="${160-v[1]/mx*140}" width="30" height="${v[1]/mx*140}" fill="#dc2626"/><text x="${62+i*90}" y="180" font-size="12" text-anchor="middle" fill="#56605b">${MON[i]}</text>`).join('')}</svg><div class="key"><b>Green</b> income &nbsp;<u>Red</u> expenses</div>`}
function home(){const a=cur=='adm',st=a?[['Users',D.users.r.length],['Banks',D.banks.r.length],['Laws',D.lawB.r.length+D.lawC.r.length],['Pending cards',card=='pending'?1:0]]:[['Income','₹'+sum('income')],['Expenses','₹'+sum('expense')],['Savings','₹'+(sum('income')-sum('expense'))],['Discipline',score()+'/100']];
 return `<div class="hero"><h1>${a?'Admin control room':P[cur].n+' dashboard'}</h1><p>${P[cur].t} Pick a feature from the menu.</p></div><div class="stats">${st.map(s=>`<div class="st"><small>${s[0]}</small><b>${s[1]}</b></div>`).join('')}</div><div class="row"><div class="box"><h3>Income vs expenses</h3>${chart()}</div><div class="box dk"><h3>AI insight</h3><p>${a?'Review pending card applications and keep law data current.':`You are saving ${Math.round(rate()*100)}% of income. Aim for 20 to 30%.`}</p><button class="btn g" style="border-color:var(--lg)" onclick="show(${P[cur].f.findIndex(f=>f[2]=='ai'||f[2]=='cadm'||f[2]=='trade')})">${a?'Open card approvals':cur=='teen'?'Ask the AI':'Try Virtual Trading'}</button></div></div>`}

function add(k){const v={};for(const x of D[k].f){let e=$(`f_${k}_${x[0]}`).value.trim();if(!e)return;v[x[0]]=x[2]=='n'?+e:e}if(EI[k]!=null){Object.assign(D[k].r[EI[k]],v);EI[k]=null}else D[k].r.push(k=='tx'?{...v,mon:'Oct'}:v);rr()}

 else if(k=='bank')b+=`<p>Click a bank to open its official website.</p><div class="lk">${D.banks.r.map(x=>`<a class="btn" href="${x.url}" target="_blank" rel="noopener">${x.name}</a>`).join('')}</div><h3 style="margin:16px 0 8px">FD, loans and interest rates (sample)</h3>`+crud('banks',{ro:1,s:1})+`<p style="font-size:13px">Sample figures. Check the bank's official site. Banking laws:</p>`+crud('lawB',{ro:1});
 else if(k=='trade')b+=`<div class="acts"><a class="btn g" href="${YT}stock+market+basics+for+beginners" target="_blank" rel="noopener">Learn</a><a class="btn" href="https://vishnu-vardhan6666.github.io/trade/traDEX.html" target="_blank" rel="noopener">Practice</a></div><p>Learn opens YouTube lessons. Practice opens the simulated trading platform. No real money is used.</p>`;
 else if(k=='tax'){const q=f[3].replace(/ /g,'+');b+=`<div class="acts"><a class="btn g" href="${YT+q}" target="_blank" rel="noopener">Watch videos</a><a class="btn" href="${BK+q}" target="_blank" rel="noopener">Open books</a></div><h3 style="margin:12px 0 8px">Books and news from FinSmart</h3>`+crud('books',{ro:1,nd:1})}
 else if(k=='card')b+=`<div class="cc"><small>FinSmart Card</small><div style="font-size:20px;margin:14px 0">•••• •••• •••• 2026</div><small>Points: ${bonus}</small></div><p>Status: <span class="tag ${card=='approved'?'ok':'wt'}">${{none:'Not applied',pending:'Waiting for admin approval',approved:'Approved'}[card]}</span></p><div class="acts">${card=='none'?`<button class="btn g" onclick="card='pending';rr()">Apply for card</button>`:''}${card=='approved'?`<button class="btn g" onclick="D.tx.r.push({desc:'FinSmart Card purchase',type:'expense',amt:500,cat:'Other',mon:'Oct'});bonus+=5;rr()">Use card (₹500)</button>`:''}</div><h3 style="margin:10px 0 6px">Reward rules</h3>`+crud('rew',{ro:1});
 else if(k=='ai')b+=`<div class="chat" id="chat">${AI.map(m=>`<div class="${m[0]=='u'?'u':''}">${m[1]}</div>`).join('')}</div><div class="frm"><input id="aq" placeholder="Ask about saving, tax, investing…" onkeydown="if(event.key=='Enter')ask()"><button class="btn g" onclick="ask()">Send</button></div>`;
 else if(k=='exp')b+=`<div class="acts"><button class="btn g" onclick="csv()">Download CSV</button><button class="btn" onclick="print()">Save as PDF</button></div>`;
 else if(k=='ctl')b+=['teen','stu','adu'].map(p=>`<h3 style="margin:12px 0 6px">${P[p].n}</h3>`+P[p].f.map((x,j)=>`<label style="font-weight:400"><input type="checkbox" style="width:auto;margin-right:8px" ${OFF[p+':'+j]?'':'checked'} onchange="OFF['${p}:${j}']=!this.checked">${x[0]}</label>`).join('')).join('');
 else if(k=='cadm')b+=card=='pending'?`<p>A FinSmart Card application is waiting.</p><div class="acts"><button class="btn g" onclick="card='approved';rr()">Approve</button><button class="btn r" onclick="card='none';rr()">Reject</button></div>`:`<p>${card=='approved'?'The latest application is approved.':'No pending applications. Apply from a user portal first.'}</p>`;
 return `<div class="box">${b}</div>`}
function ask(){const q=$('aq').value.trim();if(!q)return;const l=q.toLowerCase(),c={};D.tx.r.filter(r=>r.type=='expense').forEach(r=>c[r.cat]=(c[r.cat]||0)+r.amt);const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
 const a=/sav/.test(l)?`You saved ₹${sum('income')-sum('expense')} (${Math.round(rate()*100)}% of income). Aim for 20 to 30% and save first.`:/spend|expens/.test(l)?`Your biggest spending is ${top?top[0]+' (₹'+top[1]+')':'not clear yet'}. Split needs from wants.`:/tax/.test(l)?'Tax applies on income above the exemption limit. Keep records, use legal deductions like 80C and file on time. See Taxation for videos and books.':/invest|trade|sip/.test(l)?'Build an emergency fund first, then invest small amounts regularly. Practice in Virtual Trading before risking real money.':/bank|fd|loan/.test(l)?'Compare FD and loan rates in the Banking HUB and use official bank links only.':/business|startup|gst/.test(l)?'Track revenue and costs monthly, know the laws that apply to you and keep receipts.':'I can help with saving, spending, tax, investing, banks and business. Try one of those.';
 AI.push(['u',q.replace(/</g,'&lt;')],['b',a]);rr();setTimeout(()=>{const c=$('chat');c.scrollTop=c.scrollHeight})}
function csv(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['name,email,portal\n'+D.users.r.map(u=>[u.name,u.email,u.portal].join(',')).join('\n')],{type:'text/csv'}));a.download='finsmart-users.csv';a.click()}
addEventListener('pointermove',e=>{if(e.pointerType!='touch')document.documentElement.classList.add('cu');const t=`translate(${e.clientX}px,${e.clientY}px)`;$('cr').style.transform=t;$('cd').style.transform=t;$('cr').classList.toggle('on',!!e.target.closest('button,a,input,select,label'))});
</script>
</body>
